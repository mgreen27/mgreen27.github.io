{{ define "main" }}
<article class="editorial-page">
  {{ partial "breadcrumbs.html" . }}
  <p class="eyebrow">{{ .Params.eyebrow | default "MATTHEW GREEN / DFIR, CTI & AI" }}</p>
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="page-lead">{{ . }}</p>{{ end }}
  <div class="single-content">{{ .Content }}</div>
</article>
{{ end }}
