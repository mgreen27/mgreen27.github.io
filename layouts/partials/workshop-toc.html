<nav id="TableOfContents" aria-label="On this page">
<ul>
{{ range findRE `(?s)<h[23]\b[^>]*>.*?</h[23]>` .Content }}
  {{ $id := replaceRE `(?s)^<h[23][^>]*id="([^"]+)".*$` "$1" . }}
  {{ $label := replaceRE `(?s)\s*<a\b[^>]*>.*?</a>` "" . | plainify | strings.TrimSpace }}
  <li><a href="#{{ $id }}">{{ $label }}</a></li>
{{ end }}
</ul>
</nav>
