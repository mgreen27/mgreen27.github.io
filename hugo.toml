baseURL = 'https://dfir.au/'
locale = 'en-US'
title = "Matt's DFIR blog"
#title = "Matthew Green"
theme = 'typo'

[taxonomies]
tag = 'tags'

[services.googleAnalytics]
id = "G-G41G20SLQN"

[params]
# Meta description
description = "DFIR research, incident response techniques and open-source security tools by Matthew Green, including Velociraptor hunting and forensic analysis."
authorName = "Matthew Green"

# Appearance settings
theme = 'auto'
colorPalette = 'default'
hideHeader = false


# Intro on main page, content is markdown
#homeIntroTitle = "Matthew Green"
homeIntroContent = """
I’m a cybersecurity professional focused on incident response, threat intelligence and research. This blog shares my DFIR projects, tools and technical findings.
"""

# Collection to display on home
homeCollectionTitle = "Posts"
homeCollection = 'posts'

# Lists parameters
paginationSize = 25
listSummaries = true

# Breadcrumbs
breadcrumbs = true

# Social icons
[[params.social]]
name = "github"
url = "https://github.com/mgreen27"

[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/mgreen27/"

[[params.social]]
name = "x"
url = "https://x.com/mgreen27"

# Main menu pages
[[params.menu]]
name = "home"
url = "/"

[[params.menu]]
name = "posts"
url = "/posts"

[[params.menu]]
name = "about"
url = "/about"
social = true

[[params.menu]]
name = "projects"
url = "/projects"

# Syntax highligth on code blocks
[markup]
[markup.highlight]
style = 'algol'
